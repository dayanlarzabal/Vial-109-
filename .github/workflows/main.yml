name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter project structure
        run: |
          flutter create --org com.vial109 --project-name vial_109 temp_app
          cp -r temp_app/android .
          cp -r temp_app/ios . || true
          cp temp_app/analysis_options.yaml . || true
          rm -rf temp_app

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vial-109-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
