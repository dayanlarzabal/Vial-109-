name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (manual)
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Preparar dist
        run: |
          set -euo pipefail
          SRC=".github/workflows/dist"
          test -f "$SRC/index.html"
          rm -rf dist
          mkdir -p dist/assets
          cp "$SRC/index.html" dist/index.html
          cp "$SRC"/*.svg dist/ || true
          cp "$SRC/manifest.webmanifest" dist/ || true
          cp "$SRC"/*.js dist/assets/
          cp "$SRC"/*.css dist/assets/
          sed -i \
            -e 's|src="/assets/|src="./assets/|g' \
            -e 's|href="/assets/|href="./assets/|g' \
            -e 's|href="/favicon|href="./favicon|g' \
            -e 's|href="/manifest|href="./manifest|g' \
            dist/index.html
          find dist -type f | sort
          test -n "$(ls dist/assets/*.js)"
          test -n "$(ls dist/assets/*.css)"

      - name: Capacitor config
        run: |
          rm -f capacitor.config.ts capacitor.config.js
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.vial109.vial_109",
            "appName": "Vial 109",
            "webDir": "dist"
          }
          EOF

      - name: Install Capacitor 6
        run: |
          set -euo pipefail
          mv package.json package.json.app || true
          mv package-lock.json package-lock.json.app || true
          printf '%s\n' '{' '  "name": "vial-109",' '  "private": true' '}' > package.json
          npm install --no-audit --no-fund \
            @capacitor/core@6.2.3 \
            @capacitor/cli@6.2.3 \
            @capacitor/android@6.2.3

      - name: Add Android and sync
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vial-109-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
